<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فواتير المبيعات</title>
    <link rel="stylesheet" href="../../assets/styles/main.css">
    <link rel="stylesheet" href="../../css/navbar.css">
    <link rel="stylesheet" href="../../assets/styles/autocomplete.css">
    <link rel="stylesheet" href="sales.css">
    <script src="../../assets/js/theme.js"></script>
</head>

<body dir="rtl">
    <div id="app"></div>

    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/shared/navManager.js"></script>
    <script src="../../assets/js/fieldSystem.js"></script>
    <script src="sales.state.js"></script>
    <script src="sales.api.js"></script>
    <script src="sales.render.js"></script>
    <script src="sales.events.js"></script>
    <script src="sales.bootstrap.js"></script>

    <script src="sales.js"></script>
    <script src="../../assets/js/autocomplete.js"></script>
    <script src="../../assets/js/toast.js"></script>
    <link rel="stylesheet" href="../../assets/styles/toast.css">

    <!-- Print Template -->
    <div id="printArea" class="print-shell"
        style="display: none; direction: rtl; font-family: 'Helvetica Neue', Arial, sans-serif; padding: 30px; color: #000; background: #fff;">
        <div class="print-head" style="text-align: center; margin-bottom: 20px;">
            <h2 id="printCompanyName" class="print-company-name"
                style="font-size: 28px; font-weight: bold; margin: 0 0 5px 0;"></h2>
            <p style="font-size: 15px; margin: 0 0 15px 0;"><span id="printCompanyInfo"></span></p>

            <div class="print-header-details"
                style="display: flex; justify-content: space-between; margin-top: 20px; font-size: 15px; font-weight: 500; border-bottom: 3px solid #000; padding-bottom: 15px;">
                <div><strong>العميل:</strong> <span id="printCustomerName"></span></div>
                <div><strong>التاريخ:</strong> <span id="printInvoiceDate"></span></div>
                <div><strong>رقم الفاتورة:</strong> <span id="printInvoiceNumber"></span></div>
            </div>

            <h1
                style="font-size: 22px; font-weight: bold; text-decoration: underline; margin: 20px 0 10px 0; letter-spacing: 1px;">
                فاتورة مبيعات</h1>
        </div>

        <div class="print-body">
            <table class="print-items-table"
                style="width: 100%; border-collapse: collapse; margin-top: 10px; border: 2px solid #000;">
                <thead>
                    <tr style="background-color: #f5f5f5; border-bottom: 2px solid #000;">
                        <th
                            style="border: 1px solid #000; padding: 10px; font-size: 15px; font-weight: bold; text-align: center; width: 5%;">
                            م</th>
                        <th
                            style="border: 1px solid #000; padding: 10px; font-size: 15px; font-weight: bold; text-align: right; width: 55%;">
                            الصنف</th>
                        <th
                            style="border: 1px solid #000; padding: 10px; font-size: 15px; font-weight: bold; text-align: center; width: 10%;">
                            الكمية</th>
                        <th
                            style="border: 1px solid #000; padding: 10px; font-size: 15px; font-weight: bold; text-align: right; width: 15%;">
                            السعر</th>
                        <th
                            style="border: 1px solid #000; padding: 10px; font-size: 15px; font-weight: bold; text-align: right; width: 15%;">
                            الإجمالي</th>
                    </tr>
                </thead>
                <tbody id="printInvoiceItems" style="font-size: 15px; font-weight: 500;">
                </tbody>
            </table>

            <div style="width: 100%; margin-top: 20px; display: flex; justify-content: flex-end;">
                <table class="print-summary-table"
                    style="width: 45%; border-collapse: collapse; border: 2px solid #000; font-size: 15px;">
                    <tr style="border-bottom: 1px solid #000;">
                        <td style="padding: 8px; text-align: right; font-weight: bold; width: 60%;">إجمالي الفاتورة:
                        </td>
                        <td id="printInvoiceTotal"
                            style="border-right: 1px solid #000; padding: 8px; text-align: left; font-weight: bold; width: 40%;">
                            0.00</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #000;">
                        <td style="padding: 8px; text-align: right; font-weight: bold;">المدفوع:</td>
                        <td id="printInvoicePaid"
                            style="border-right: 1px solid #000; padding: 8px; text-align: left; font-weight: bold;">
                            0.00</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #000;">
                        <td style="padding: 8px; text-align: right; font-weight: bold;">المتبقي من الفاتورة:</td>
                        <td id="printInvoiceRemaining"
                            style="border-right: 1px solid #000; padding: 8px; text-align: left; font-weight: bold;">
                            0.00</td>
                    </tr>
                    <tr class="print-highlight-row" style="border-bottom: 1px solid #000; background-color: #eef2ff;">
                        <td style="padding: 8px; text-align: right; font-weight: bold; font-size: 16px;">الرصيد السابق
                            للعميل:</td>
                        <td id="printCustomerPreviousBalance"
                            style="border-right: 1px solid #000; padding: 8px; text-align: left; font-weight: bold; font-size: 16px;">
                            0.00</td>
                    </tr>
                    <tr class="print-highlight-row" style="background-color: #eef2ff;">
                        <td style="padding: 8px; text-align: right; font-weight: bold; font-size: 16px;">إجمالي حساب
                            العميل الحالي:</td>
                        <td id="printCustomerCurrentBalance"
                            style="border-right: 1px solid #000; padding: 8px; text-align: left; font-weight: bold; font-size: 16px;">
                            0.00</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="print-footer"
            style="margin-top: 40px; text-align: center; font-size: 14px; font-weight: bold; border-top: 1px dashed #000; padding-top: 15px;">
            <p id="printFooterText">شكراً لتعاملكم معنا</p>
        </div>
    </div>
</body>

</html>
